[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edith"
version = "0.1.0"
description = "Local-first, zero-API-cost autonomous product development agent platform"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "structlog>=24.4",
    "typer>=0.12",
    "psutil>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    "types-psutil>=6.0",
]

[project.scripts]
edith = "edith.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "integration: requires a live Ollama server and a pulled model",
    "benchmark: runs the full autonomous loop against the live model (slow)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
# S (bandit) and BLE (blind except) are enabled deliberately: this platform executes
# subprocesses and parses model output, so unreviewed shell calls and swallowed
# exceptions are the exact defects that matter here.
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "S", "BLE", "PLC0415"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Asserts are the point of a test; subprocess/self-import checks do not apply there.
# Asserts are the point of a test; invoking `git`/`cmd` by name to arrange fixture state
# is intentional, and local imports keep test helpers close to their use.
"tests/**" = ["S101", "S603", "S607", "PLC0415"]
# Benchmark fixtures are pytest files a generated project is measured against, and the
# runners arrange fixture state with `git` and spawn pytest by design. Never linted before
# M12, which is why "ruff clean" had always been reported against a narrower scope.
"benchmarks/**" = ["S101", "S603", "S607", "PLC0415"]
# Fixtures imported from another test module are legitimately "redefined" by every test
# that requests them, and scenario classes are named after the requirement labels they cover.
"tests/test_hardening_suite.py" = ["S101", "S603", "S607", "PLC0415", "F811", "N801"]
"tests/test_memory_integration.py" = ["S101", "S603", "S607", "PLC0415", "F811", "E402"]
"tests/test_memory_strategy.py" = ["S101", "S603", "S607", "PLC0415", "F811", "E402"]
"tests/test_memory_governor_integration.py" = [
    "S101", "S603", "S607", "PLC0415", "F811", "E402", "SLF001",
]

[tool.mypy]
python_version = "3.13"
files = ["src/edith"]
strict = true
warn_unused_ignores = true
disallow_untyped_decorators = false
plugins = []
